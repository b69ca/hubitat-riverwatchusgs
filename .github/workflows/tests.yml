name: Driver tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Groovy 2.4.21
        run: |
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/codehaus/groovy/groovy-all/2.4.21/groovy-all-2.4.21.jar --output /tmp/groovy-all.jar
          echo 'de65260cf2070442e99882f2f3d72e7531725c1e6a257446cc0cea525c607bd0  /tmp/groovy-all.jar' | sha256sum --check
      - name: Run driver tests
        run: java -cp /tmp/groovy-all.jar groovy.ui.GroovyMain tests/RiverWatchUSGSTest.groovy
